name: Windows Playtest Build

on:
  push:
    branches:
      - main
      - "build/**"
      - "ci/**"
    paths:
      - "project.godot"
      - "export_presets.cfg"
      - "scenes/**"
      - "scripts/**"
      - "data/**"
      - "assets/**"
      - "tests/**"
      - ".github/workflows/windows-playtest.yml"
  pull_request:
    branches:
      - main
    paths:
      - "project.godot"
      - "export_presets.cfg"
      - "scenes/**"
      - "scripts/**"
      - "data/**"
      - "assets/**"
      - "tests/**"
      - ".github/workflows/windows-playtest.yml"
  workflow_dispatch:

concurrency:
  group: windows-playtest-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Godot 4.7.2 with export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Import project
        run: godot --headless --path . --editor --quit

      - name: Run vertical-slice acceptance
        run: godot --headless --path . --script tests/vertical_slice_smoke.gd

      - name: Export Windows playtest
        run: |
          mkdir -p builds/windows
          godot --headless --path . --export-release "Windows Desktop" builds/windows/NicksLuminousValley.exe

      - name: Verify artifact exists
        run: |
          test -f builds/windows/NicksLuminousValley.exe
          ls -lh builds/windows

      - name: Upload Windows playtest
        uses: actions/upload-artifact@v6
        with:
          name: Nicks-Luminous-Valley-Windows-Playtest
          path: builds/windows/
          if-no-files-found: error
          retention-days: 14
